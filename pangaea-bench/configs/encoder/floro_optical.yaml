_target_: pangaea.encoders.floro_encoder.FLORO_Wrapper
encoder_weights: ./pretrained_models/FLORO_Encoder_dt20260301_222740_150.pth.jar
download_url: null

# Retrieve dataset-specific information
dataset_cfg:
  bands: ${dataset.bands}
  data_mean: ${dataset.data_mean}
  data_std: ${dataset.data_std}
  data_min: ${dataset.data_min}
  data_max: ${dataset.data_max}
  num_classes: ${dataset.num_classes}
  img_size: ${dataset.img_size}

input_size: 256
d_model: 1024
patch_size: 16
depth: 24
num_heads: 16
mlp_ratio: 4.0
pos_embed_type: absolute

mask_ratio_ms: 0.0
mask_ratio_mods: 0.0

#PASTIS
input_bands:
  optical:
    - B2
    - B3
    - B4
    - B5
    - B8
    - B8A
    - B11
    - B12

band_map:
  B: B2
  G: B3
  R: B4
  RE: B5
  NIR: B8
  NIR2: B8A
  SWIR1: B11
  SWIR2: B12

band_map_mod:
  E: null
  VV: null
  VH: null

use_dem: false
use_sar: false

output_layers:
  - 6
  - 12
  - 18
  - 23

output_dim: 1024


# optical: [B2,B3,B4,B5,B8,B8A,B11,B12]
# mods:    [E,VV,VH]
floro_stats:
  optical:
    mean: {B2: 0.2073523, B3: 0.2670019, B4: 0.28107855, B5: 0.24270512, B8: 0.2793084, B8A: 0.14631674, B11: 0.20326711, B12: 0.14910233}
    std:  {B2: 0.18876277, B3: 0.21284738, B4: 0.20284666, B5: 0.15357633, B8: 0.12527913, B8A: 0.17737003, B11: 0.11302987, B12: 0.09519225}
  mods:
    mean: {E: 2094.924, VV: -11.424427, VH: -18.914251}
    std:  {E: 1678.725, VV: 3.4653134, VH: 4.3036957}

